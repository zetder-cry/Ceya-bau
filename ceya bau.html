<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sipaling suka spiderman</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --spider-red:#E31B23;
  --spider-red-dark:#a5121a;
  --hero-blue:#0B3D91;
  --hero-blue-light:#1a56c4;
  --ink:#090909;
  --paper:#FFFFFF;
  --page-cream:#FFF7E9;
  --glow-gold:#FFD23F;
  --font-display:'Bangers', 'Comic Sans MS', cursive;
  --font-body:'Nunito', -apple-system, sans-serif;
  --vh:1vh;
}
*{box-sizing:border-box;}
html,body{
  margin:0;padding:0;width:100%;height:100%;
  background:var(--ink);
  font-family:var(--font-body);
  overflow:hidden;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
body{color:var(--paper);}
button{font-family:var(--font-body);}
h1,h2,h3{font-family:var(--font-display);margin:0;letter-spacing:.5px;}

::selection{background:var(--spider-red);color:var(--paper);}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;}
}
#app{
  position:relative;
  width:100%;
  height:calc(var(--vh, 1vh) * 100);
  overflow:hidden;
  background:
    radial-gradient(ellipse at 50% 20%, rgba(11,61,145,0.35), transparent 60%),
    radial-gradient(ellipse at 50% 100%, rgba(227,27,35,0.25), transparent 55%),
    var(--ink);
}

.halftone{
  position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(var(--paper) 1px, transparent 1.4px);
  background-size:10px 10px;
  opacity:.05;
  mix-blend-mode:screen;
}

.scene{
  position:absolute;inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  transition:opacity .5s ease;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.scene.active{
  opacity:1;
  visibility:visible;
  pointer-events:auto;
}
.speed-lines{
  position:absolute;inset:-10%;pointer-events:none;opacity:0;
  background:repeating-conic-gradient(from 0deg, rgba(255,255,255,0.05) 0deg 1deg, transparent 1deg 6deg);
  transition:opacity .4s ease;
}
.scene.active .speed-lines{opacity:1;animation:spin-slow 40s linear infinite;}
@keyframes spin-slow{to{transform:rotate(360deg);}}

.sound-toggle{
  position:fixed;
  top:calc(14px + env(safe-area-inset-top));
  right:calc(14px + env(safe-area-inset-right));
  z-index:500;
  width:46px;height:46px;
  border-radius:50%;
  border:2px solid var(--glow-gold);
  background:rgba(9,9,9,.65);
  color:var(--glow-gold);
  font-size:20px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  backdrop-filter:blur(4px);
  transition:transform .2s ease, box-shadow .2s ease;
  box-shadow:0 0 12px rgba(255,210,63,.35);
}
.sound-toggle:active{transform:scale(.9);}
.sound-toggle:focus-visible{outline:3px solid var(--glow-gold);outline-offset:2px;}

.btn{
  font-family:var(--font-display);
  font-size:clamp(18px,4vw,24px);
  letter-spacing:1px;
  padding:14px 34px;
  border-radius:40px;
  border:3px solid var(--ink);
  cursor:pointer;
  position:relative;
  transition:transform .15s ease, box-shadow .15s ease;
  min-height:48px;
}
.btn:active{transform:scale(.94);}
.btn:focus-visible{outline:3px solid var(--glow-gold);outline-offset:3px;}
.btn-primary{
  background:var(--spider-red);
  color:var(--paper);
  box-shadow:0 4px 0 var(--spider-red-dark), 0 0 22px rgba(227,27,35,.55);
}
.btn-primary:active{box-shadow:0 1px 0 var(--spider-red-dark), 0 0 12px rgba(227,27,35,.4);}
.btn-secondary{
  background:var(--hero-blue);
  color:var(--paper);
  box-shadow:0 4px 0 #062a7a, 0 0 18px rgba(11,61,145,.5);
}

#scene-intro{gap:26px;text-align:center;padding-left:20px;padding-right:20px;}

.spider-symbol{
  width:min(38vw,170px);
  height:min(38vw,170px);
  filter:drop-shadow(0 0 18px rgba(227,27,35,.8)) drop-shadow(0 0 34px rgba(227,27,35,.35));
  animation:symbol-in 1.2s cubic-bezier(.2,.9,.25,1) both, symbol-breathe 3.4s ease-in-out 1.2s infinite;
}
@keyframes symbol-in{
  0%{opacity:0;transform:scale(.4) rotate(-8deg);}
  60%{opacity:1;transform:scale(1.08) rotate(2deg);}
  100%{opacity:1;transform:scale(1) rotate(0deg);}
}
@keyframes symbol-breathe{
  0%,100%{transform:scale(1);}
  50%{transform:scale(1.035);}
}

.intro-text{display:flex;flex-direction:column;align-items:center;gap:16px;max-width:560px;}
.intro-line{
  font-size:clamp(15px,3.6vw,19px);
  font-weight:700;
  opacity:0;
  transform:translateY(10px);
  transition:opacity .7s ease, transform .7s ease;
}
.intro-line.show{opacity:1;transform:translateY(0);}
.intro-ready{
  font-family:var(--font-display);
  font-size:clamp(30px,8vw,46px);
  color:var(--glow-gold);
  text-shadow:0 0 14px rgba(255,210,63,.7);
  opacity:0;transform:scale(.6);
  transition:opacity .5s ease, transform .5s cubic-bezier(.3,1.6,.5,1);
}
.intro-ready.show{opacity:1;transform:scale(1);}
#enterWebBtn{opacity:0;transform:translateY(14px);transition:opacity .5s ease, transform .5s ease;}
#enterWebBtn.show{opacity:1;transform:translateY(0);}

.web-corner{position:absolute;width:min(46vw,300px);height:min(46vw,300px);opacity:.35;pointer-events:none;}
.web-corner--tl{top:-6%;left:-6%;}
.web-corner--tr{top:-6%;right:-6%;transform:scaleX(-1);}
.web-corner--bl{bottom:-6%;left:-6%;transform:scaleY(-1);}
.web-corner--br{bottom:-6%;right:-6%;transform:scale(-1,-1);}
.web-transition{
  position:fixed;inset:0;z-index:900;
  display:flex;align-items:center;justify-content:center;
  pointer-events:none;
}
.web-transition svg{width:100%;height:100%;}
.web-strand{
  stroke:var(--paper);
  stroke-width:2;
  fill:none;
  stroke-dasharray:1400;
  stroke-dashoffset:1400;
}
.web-fill{
  fill:var(--ink);
  opacity:0;
}
.web-transition.firing .web-strand{
  animation:web-shoot .55s cubic-bezier(.2,.9,.2,1) forwards;
}
.web-transition.firing .web-fill{
  animation:web-cover .5s ease .35s forwards;
}
.web-transition.retreating .web-fill{
  animation:web-uncover .5s ease forwards;
}
.web-transition.retreating .web-strand{
  animation:web-retreat .5s ease forwards;
}
@keyframes web-shoot{to{stroke-dashoffset:0;}}
@keyframes web-cover{to{opacity:1;}}
@keyframes web-uncover{to{opacity:0;}}
@keyframes web-retreat{to{stroke-dashoffset:-1400;}}

.thwip-text{
  position:absolute;
  font-family:var(--font-display);
  font-size:clamp(40px,10vw,90px);
  color:var(--glow-gold);
  -webkit-text-stroke:3px var(--ink);
  text-shadow:0 0 24px rgba(255,210,63,.8);
  opacity:0;
  transform:scale(.4) rotate(-8deg);
  z-index:901;
}
.thwip-text.pop{animation:comic-pop .6s cubic-bezier(.2,1.6,.4,1) forwards;}
@keyframes comic-pop{
  0%{opacity:0;transform:scale(.3) rotate(-10deg);}
  35%{opacity:1;transform:scale(1.15) rotate(4deg);}
  55%{transform:scale(.95) rotate(-2deg);}
  75%{transform:scale(1.04) rotate(1deg);}
  100%{opacity:0;transform:scale(1) rotate(0deg);}
}
.shake{animation:screen-shake .4s ease;}
@keyframes screen-shake{
  0%,100%{transform:translate(0,0);}
  20%{transform:translate(-6px,3px) rotate(-.4deg);}
  40%{transform:translate(5px,-4px) rotate(.4deg);}
  60%{transform:translate(-4px,4px) rotate(-.3deg);}
  80%{transform:translate(4px,-2px) rotate(.3deg);}
}
.sparkle{
  position:absolute;
  width:10px;height:10px;
  pointer-events:none;
  background:var(--glow-gold);
  clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
  opacity:0;
  z-index:850;
}
.sparkle.go{animation:sparkle-pop .9s ease forwards;}
@keyframes sparkle-pop{
  0%{opacity:0;transform:scale(0) rotate(0deg);}
  30%{opacity:1;transform:scale(1) rotate(60deg);}
  100%{opacity:0;transform:scale(.3) translateY(-40px) rotate(140deg);}
}
#scene-book{padding:16px;}
.book-stage{
  position:relative;
  width:min(92vw,780px);
  height:min(78vh,560px);
  perspective:2400px;
}
.book{
  position:relative;
  width:100%;height:100%;
  transform-style:preserve-3d;
  isolation:isolate;
  z-index:2;
}
.book-cover{
  position:absolute;inset:0;
  background:
    linear-gradient(155deg, var(--spider-red) 0%, var(--spider-red-dark) 55%, var(--hero-blue) 130%);
  border-radius:14px;
  border:4px solid var(--ink);
  box-shadow:0 18px 0 rgba(0,0,0,.45), 0 30px 50px rgba(0,0,0,.55), inset 0 0 0 3px rgba(255,255,255,.15);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;
  text-align:center;padding:30px;
  transform-origin:left center;
  transition:transform .9s cubic-bezier(.4,.1,.2,1);
  backface-visibility:hidden;
  z-index:20;
  background-image:
    radial-gradient(var(--paper) 1px, transparent 1.4px),
    linear-gradient(155deg, var(--spider-red) 0%, var(--spider-red-dark) 55%, var(--hero-blue) 130%);
  background-size:12px 12px, auto;
  background-blend-mode:overlay, normal;
}
.book.open .book-cover{transform:rotateY(-165deg);pointer-events:none;}

.book-cover .cover-web{position:absolute;inset:0;opacity:.25;}
.book-title{
  font-size:clamp(26px,7vw,46px);
  color:var(--paper);
  text-shadow:0 3px 0 var(--ink), 0 0 24px rgba(255,255,255,.35);
  line-height:1.15;
}
.book-title span{color:var(--glow-gold);}

.book-pages{
  position:absolute;inset:0;
  border-radius:14px;
  overflow:hidden;
  background:var(--page-cream);
  border:4px solid var(--ink);
  box-shadow:0 18px 0 rgba(0,0,0,.35), 0 26px 44px rgba(0,0,0,.5);
  isolation:isolate;
  z-index:1;
  transform-style:preserve-3d;
}
.page{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  padding:clamp(20px,4vw,42px);
  transform-origin:left center;
  transform:rotateY(0deg);
  transition:transform .75s cubic-bezier(.4,.1,.2,1);
  backface-visibility:hidden;
  background:
    radial-gradient(var(--ink) .6px, transparent 1px) 0 0/14px 14px,
    var(--page-cream);
  background-blend-mode:overlay,normal;
  opacity:.04;
  overflow-y:auto;
}
.page{opacity:1;}
.page.flipped{transform:rotateY(-165deg);}
.page{z-index:1;}
.page-num{
  position:absolute;bottom:10px;right:16px;
  font-family:var(--font-display);
  font-size:14px;color:var(--hero-blue);opacity:.6;
}

.page-eyebrow{
  font-family:var(--font-display);
  font-size:clamp(20px,5vw,30px);
  color:var(--spider-red);
  text-shadow:1px 1px 0 var(--ink);
}
.page-message{
  font-size:clamp(14px,3.4vw,17px);
  line-height:1.6;
  color:var(--ink);
  font-weight:600;
  margin-top:10px;
  white-space:pre-line;
}
.photo-slot{
  margin-top:14px;
  border:3px dashed var(--hero-blue);
  border-radius:12px;
  min-height:120px;
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:4px;
  color:var(--hero-blue);
  font-weight:700;
  font-size:13px;
  background:rgba(11,61,145,.06);
  overflow:hidden;
  flex:1 1 auto;
}
.photo-slot img{display:block;width:100%;height:100%;object-fit:cover;}
.photo-slot.error{border-style:solid;color:var(--spider-red);}
.photo-caption{font-size:12px;color:var(--ink);opacity:.7;margin-top:6px;font-weight:700;}

.speech-bubble{
  position:relative;
  background:var(--paper);
  border:3px solid var(--ink);
  border-radius:16px;
  padding:10px 14px;
  margin:8px 0;
  font-weight:700;
  font-size:14px;
  color:var(--ink);
}
.speech-bubble:nth-child(even){align-self:flex-end;}
.wishes-list{display:flex;flex-direction:column;gap:6px;margin-top:12px;}

.final-page .page-message{font-size:clamp(15px,3.8vw,19px);}
.final-happy{
  margin-top:auto;
  font-family:var(--font-display);
  font-size:clamp(30px,8vw,48px);
  color:var(--spider-red);
  text-align:center;
  text-shadow:2px 2px 0 var(--ink);
}
.page-nav{
  position:absolute;top:50%;transform:translateY(-50%);
  width:56px;height:56px;
  border-radius:50%;
  border:3px solid var(--ink);
  background:var(--spider-red);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  z-index:30;
  box-shadow:0 4px 0 var(--spider-red-dark), 0 0 16px rgba(227,27,35,.5);
  transition:transform .15s ease, opacity .3s ease;
}
.page-nav svg{width:30px;height:30px;}
.page-nav--prev{left:-20px;}
.page-nav--next{right:-20px;}
.page-nav:active{transform:translateY(-50%) scale(.88);}
.page-nav[disabled]{opacity:.25;pointer-events:none;}
.page-nav.shoot{animation:nav-shoot .45s ease;}
@keyframes nav-shoot{
  0%{transform:translateY(-50%) scale(1);}
  40%{transform:translateY(-50%) scale(1.25);}
  100%{transform:translateY(-50%) scale(1);}
}
.page-web-shot{
  position:absolute;
  height:3px;
  background:linear-gradient(90deg, rgba(255,255,255,0), var(--paper) 40%, var(--paper));
  transform-origin:left center;
  opacity:0;
  z-index:25;
  pointer-events:none;
}
.page-web-shot.fire{animation:web-shot-fly .4s ease-out forwards;}
@keyframes web-shot-fly{
  0%{opacity:0;width:0;}
  15%{opacity:1;}
  70%{width:var(--shot-len,220px);opacity:1;}
  100%{width:var(--shot-len,220px);opacity:0;}
}

.book-closing-msg{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;text-align:center;
  opacity:0;pointer-events:none;
  transition:opacity .8s ease;
  z-index:5;
}
.book-closing-msg.show{opacity:1;pointer-events:auto;}
.book-closing-msg p{
  font-family:var(--font-display);
  font-size:clamp(22px,6vw,32px);
  color:var(--glow-gold);
  text-shadow:0 0 16px rgba(255,210,63,.6);
}
#scene-outro{gap:0;}
.outro-stage{
  position:relative;
  width:100%;height:56%;
  display:flex;align-items:flex-end;justify-content:center;
}
.cat{
  position:relative;
  width:min(52vw,220px);
  transform:translateX(-160vw);
  animation:cat-walk-in 1.6s cubic-bezier(.3,.7,.3,1) .3s forwards;
}
.cat.arrived{animation:none;transform:translateX(0);}
@keyframes cat-walk-in{
  0%{transform:translateX(-160vw);}
  80%{transform:translateX(8px);}
  100%{transform:translateX(0);}
}
.cat svg{width:100%;height:auto;display:block;filter:drop-shadow(0 10px 14px rgba(0,0,0,.5));}
.cat.bob{animation:cat-bob 1.4s ease-in-out infinite;}
@keyframes cat-bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
.cat .cat-eye{transform-origin:center;}
.cat.blink .cat-eye{animation:cat-blink .28s ease;}
@keyframes cat-blink{0%,100%{transform:scaleY(1);}50%{transform:scaleY(.1);}}
.cat .cat-arm-l{transform-origin:80% 40%;}
.cat.wave .cat-arm-l{animation:cat-wave .9s ease-in-out;}
@keyframes cat-wave{
  0%,100%{transform:rotate(0deg);}
  25%{transform:rotate(-35deg);}
  50%{transform:rotate(-10deg);}
  75%{transform:rotate(-35deg);}
}
.cat.pose .cat-arm-r{animation:cat-pose .6s ease forwards;}
@keyframes cat-pose{to{transform:rotate(-70deg) translate(-4px,-2px);}}

.gift{
  position:absolute;
  bottom:6%;
  width:min(20vw,90px);
  opacity:0;
  transform:scale(0) translateY(10px);
  transition:opacity .5s cubic-bezier(.3,1.6,.4,1), transform .5s cubic-bezier(.3,1.6,.4,1);
  z-index:12;
}
.gift.show{opacity:1;transform:scale(1) translateY(0);}
.flower-gift{left:56%;}
.choc-gift{left:56%;}

.outro-message{
  text-align:center;
  padding:0 20px;
  opacity:0;
  transform:translateY(16px);
  transition:opacity .7s ease, transform .7s ease;
}
.outro-message.show{opacity:1;transform:translateY(0);}
.outro-message h1{
  font-size:clamp(38px,11vw,64px);
  color:var(--spider-red);
  text-shadow:0 0 20px rgba(255,255,255,.4), 3px 3px 0 var(--ink);
}
.outro-message p{
  margin-top:10px;
  font-size:clamp(14px,3.6vw,18px);
  font-weight:700;
  max-width:520px;
}

.heart-web{
  position:absolute;top:2%;left:50%;
  transform:translateX(-50%);
  width:min(44vw,180px);
  opacity:0;
  pointer-events:none;
}
.heart-web.show{opacity:1;}
.heart-web path{
  stroke:var(--glow-gold);
  stroke-width:3;
  fill:none;
  stroke-dasharray:600;
  stroke-dashoffset:600;
}
.heart-web.show path{animation:heart-draw 1.1s ease forwards, heart-glow 1.6s ease .9s infinite alternate;}
@keyframes heart-draw{to{stroke-dashoffset:0;}}
@keyframes heart-glow{from{filter:drop-shadow(0 0 4px var(--glow-gold));}to{filter:drop-shadow(0 0 16px var(--glow-gold));}}

.floating-heart{
  position:absolute;bottom:-10%;
  font-size:20px;
  color:var(--spider-red);
  opacity:0;
  pointer-events:none;
  z-index:15;
}
.floating-heart.go{animation:heart-float 3.2s ease-in forwards;}
@keyframes heart-float{
  0%{opacity:0;transform:translateY(0) scale(.6);}
  15%{opacity:1;}
  100%{opacity:0;transform:translateY(-70vh) scale(1.1) rotate(20deg);}
}

#confettiCanvas{
  position:absolute;inset:0;
  width:100%;height:100%;
  pointer-events:none;
  z-index:40;
}

.finale-buttons{
  display:flex;gap:14px;flex-wrap:wrap;justify-content:center;
  margin-top:22px;
  opacity:0;transform:translateY(10px);
  transition:opacity .6s ease, transform .6s ease;
}
.finale-buttons.show{opacity:1;transform:translateY(0);}
@media (max-width:640px){
  .book-stage{width:88vw;height:74vh;}
  .page-nav{width:46px;height:46px;}
  .page-nav svg{width:24px;height:24px;}
  .page-nav--prev{left:-14px;}
  .page-nav--next{right:-14px;}
}
@media (min-width:900px){
  #scene-book{ }
  .book-stage{width:640px;height:520px;}
}
</style>
</head>
<body>
<div id="app">
  <div class="halftone"></div>

  <button id="soundToggle" class="sound-toggle" aria-label="Turn sound on or off" aria-pressed="true">🔊</button>
  <section id="scene-intro" class="scene active">
    <div class="speed-lines"></div>
    <svg class="web-corner web-corner--tl" viewBox="0 0 200 200"><use href="#webPattern"/></svg>
    <svg class="web-corner web-corner--tr" viewBox="0 0 200 200"><use href="#webPattern"/></svg>
    <svg class="web-corner web-corner--bl" viewBox="0 0 200 200"><use href="#webPattern"/></svg>
    <svg class="web-corner web-corner--br" viewBox="0 0 200 200"><use href="#webPattern"/></svg>

    <svg class="spider-symbol" viewBox="0 0 200 200" aria-hidden="true">
      <g fill="none" stroke="#E31B23" stroke-width="4">
        <line x1="100" y1="20" x2="100" y2="180"/>
        <line x1="30" y1="55" x2="170" y2="145"/>
        <line x1="170" y1="55" x2="30" y2="145"/>
        <line x1="20" y1="100" x2="180" y2="100"/>
      </g>
      <path d="M100 70 C84 70 72 84 72 100 C72 118 84 132 100 132 C116 132 128 118 128 100 C128 84 116 70 100 70 Z" fill="#090909" stroke="#E31B23" stroke-width="3"/>
      <path d="M100 84 C112 84 118 92 118 100" fill="none" stroke="#FFD23F" stroke-width="3" stroke-linecap="round"/>
      <g stroke="#090909" stroke-width="5" stroke-linecap="round">
        <path d="M78 92 C50 78 30 70 14 66"/>
        <path d="M78 100 C48 100 26 100 8 100"/>
        <path d="M78 108 C50 122 30 130 14 134"/>
        <path d="M122 92 C150 78 170 70 186 66"/>
        <path d="M122 100 C152 100 174 100 192 100"/>
        <path d="M122 108 C150 122 170 130 186 134"/>
      </g>
    </svg>

    <div class="intro-text">
      <p class="intro-line" data-line="1">Someone special is celebrating a birthday&hellip;</p>
      <p class="intro-line" data-line="2">And a little hero has something to say.</p>
      <p class="intro-ready" id="readyText">READY?</p>
      <button id="enterWebBtn" class="btn btn-primary">ENTER THE WEB</button>
    </div>
  </section>
  <div id="webTransition" class="web-transition" aria-hidden="true">
    <svg viewBox="0 0 100 100" preserveAspectRatio="none">
      <rect class="web-fill" x="0" y="0" width="100" height="100"/>
      <g class="web-strand">
        <path d="M-5,-5 L110,110" />
        <path d="M110,-5 L-5,110" />
        <path d="M50,-8 L50,108" />
        <path d="M-8,50 L108,50" />
        <path d="M-5,-5 Q50,20 110,-5" />
        <path d="M-5,110 Q50,80 110,110" />
      </g>
    </svg>
    <div class="thwip-text" id="thwipText">THWIP!</div>
  </div>

  <svg width="0" height="0" style="position:absolute">
    <defs>
      <g id="webPattern" fill="none" stroke="#FFFFFF" stroke-width="1.5">
        <path d="M0,0 L200,200 M0,60 Q100,90 200,60 M0,120 Q100,150 200,120 M0,0 L0,200 M60,0 Q90,100 60,200 M120,0 Q150,100 120,200"/>
      </g>
    </defs>
  </svg>

  <section id="scene-book" class="scene">
    <div class="book-stage">
      <div class="book-pages" id="bookPages"><!-- pages injected by JS --></div>
      <div class="book" id="book">
        <div class="book-cover" id="bookCover">
          <svg class="cover-web" viewBox="0 0 100 100" preserveAspectRatio="none"><use href="#webPattern"/></svg>
          <h1 class="book-title">HAPPY BIRTHDAY<br><span id="coverName">CEYA</span></h1>
          <button id="openBookBtn" class="btn btn-primary">OPEN THE BOOK</button>
        </div>
      </div>
      <button class="page-nav page-nav--prev" id="prevPageBtn" aria-label="Previous page" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><path d="M15 5 L8 12 L15 19"/></svg>
      </button>
      <button class="page-nav page-nav--next" id="nextPageBtn" aria-label="Next page" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><path d="M9 5 L16 12 L9 19"/></svg>
      </button>
    </div>
    <div class="book-closing-msg" id="bookClosingMsg">
      <p>Wait&hellip;</p>
      <p>There is still one more surprise.</p>
    </div>
  </section>

  <section id="scene-outro" class="scene">
    <div class="outro-stage">
      <svg class="heart-web" id="heartWeb" viewBox="0 0 100 90"><path d="M50 84 C10 56 6 28 24 14 C38 4 50 14 50 26 C50 14 62 4 76 14 C94 28 90 56 50 84 Z"/></svg>

      <div class="cat" id="cat">
        <svg viewBox="0 0 220 220" aria-hidden="true">
          <ellipse cx="110" cy="205" rx="60" ry="10" fill="rgba(0,0,0,.35)"/>
          <path class="cat-cape" d="M70 90 Q40 150 55 195 L110 160 Z" fill="#0B3D91" stroke="#090909" stroke-width="3"/>
          <path class="cat-cape" d="M150 90 Q180 150 165 195 L110 160 Z" fill="#0B3D91" stroke="#090909" stroke-width="3"/>
          <ellipse cx="110" cy="150" rx="46" ry="50" fill="#2b2b2b" stroke="#090909" stroke-width="3"/>
          <path d="M72 110 L58 76 L92 96 Z" fill="#2b2b2b" stroke="#090909" stroke-width="3"/>
          <path d="M148 110 L162 76 L128 96 Z" fill="#2b2b2b" stroke="#090909" stroke-width="3"/>
          <circle cx="110" cy="112" r="42" fill="#3a3a3a" stroke="#090909" stroke-width="3"/>
          <path d="M78 98 Q110 84 142 98 Q142 118 110 124 Q78 118 78 98 Z" fill="#E31B23" stroke="#090909" stroke-width="3"/>
          <circle class="cat-eye" cx="94" cy="104" r="7" fill="#FFD23F"/>
          <circle class="cat-eye" cx="126" cy="104" r="7" fill="#FFD23F"/>
          <circle cx="94" cy="104" r="2.4" fill="#090909"/>
          <circle cx="126" cy="104" r="2.4" fill="#090909"/>
          <path d="M104 116 L110 121 L116 116" fill="none" stroke="#090909" stroke-width="2.4" stroke-linecap="round"/>
          <g class="cat-arm-l">
            <ellipse cx="72" cy="150" rx="12" ry="24" fill="#2b2b2b" stroke="#090909" stroke-width="3"/>
          </g>
          <g class="cat-arm-r">
            <ellipse cx="148" cy="150" rx="12" ry="24" fill="#2b2b2b" stroke="#090909" stroke-width="3"/>
          </g>
          <circle cx="110" cy="150" r="14" fill="#E31B23" stroke="#090909" stroke-width="2.5"/>
        </svg>
      </div>

      <svg class="gift flower-gift" id="flowerGift" viewBox="0 0 100 120" aria-hidden="true">
        <path d="M50 120 L50 60" stroke="#0B3D91" stroke-width="5" fill="none"/>
        <circle cx="50" cy="40" r="14" fill="#E31B23" stroke="#090909" stroke-width="2"/>
        <circle cx="30" cy="55" r="12" fill="#FFD23F" stroke="#090909" stroke-width="2"/>
        <circle cx="70" cy="55" r="12" fill="#FFFFFF" stroke="#090909" stroke-width="2"/>
        <circle cx="50" cy="70" r="12" fill="#0B3D91" stroke="#090909" stroke-width="2"/>
      </svg>

      <svg class="gift choc-gift" id="chocGift" viewBox="0 0 100 80" aria-hidden="true">
        <rect x="10" y="20" width="80" height="55" rx="6" fill="#E31B23" stroke="#090909" stroke-width="3"/>
        <rect x="10" y="20" width="80" height="16" fill="#FFD23F" stroke="#090909" stroke-width="2"/>
        <rect x="42" y="10" width="16" height="65" fill="#0B3D91" stroke="#090909" stroke-width="2"/>
      </svg>
    </div>

    <div class="outro-message" id="outroMessage">
      <h1>HAPPY BIRTHDAY!</h1>
      <p id="outroPersonalMsg"></p>
    </div>

    <canvas id="confettiCanvas"></canvas>

    <div class="finale-buttons" id="finaleButtons">
      <button id="readAgainBtn" class="btn btn-secondary">READ IT AGAIN</button>
      <button id="oneMoreTimeBtn" class="btn btn-primary">ONE MORE TIME</button>
    </div>
  </section>
</div>

<script>
const birthdayConfig = {
  recipientName: "CEYA",
  senderName: "ZEET",

  intro: {
    line1: "Someone special is celebrating a birthday\u2026",
    line2: "And a little hero has something to say."
  },
  pages: [
    {
      type: "text",
      title: "Opening",
      message: "Once upon a day, a hero that name is zeet swung all the way over just to here just for to say Happy Birthday Ceya bau! Turn the page and believe me, this is going to be good."
    },
    {
      type: "text",
      title: "Birthday Wish",
      message: "May this new year of yours be full of soft landings, loud laughter, and days that feel exactly like you hoped they would."
    },
    {
      type: "text",
      title: "Personal Message",
      message: "Halo tante ceya hehe hbd ya, telat beberapa hari ini mah ga masalah kali hehe. umur berapa sekarang? 21 ya? yahaha tua."
    },
    {
      type: "photo",
      title: "Ur photo",
      message: "si paling nasionalis",
      photo: { src: "https://files.catbox.moe/vvygui.jpg", caption: "birthday girl", date: "" }
    },
    {
      type: "wishes",
      title: "Things I Wish For You",
      wishes: [
        "That you always find your way back to the people who love you.",
        "That your Wi-Fi is fast.",
        "That this year surprises you in all the good ways."
      ]
    },
    {
      type: "final",
      title: "Final Message",
      message: "However far apart we are, I'm cheering the loudest for you today.",
      signature: "\u2014 with respect, {{sender}}"
    }
  ],

  outro: {
    message: "Happy birthday, {{recipient}}! I hope your day is as wonderful as you are.",
    flowerMessage: "These flowers are for you \u2014 as bright as you make everything around you.",
    chocolateMessage: "And something sweet, because you deserve it."
  },

  music: {
    intro: "",
    book: "",
    outro: ""
  },

  soundEffectsEnabled: true
};

(function(){
  "use strict";
  function setVh(){document.documentElement.style.setProperty('--vh', (window.innerHeight*0.01)+'px');}
  setVh();
  window.addEventListener('resize', setVh);
  const el = (id)=>document.getElementById(id);
  const sceneIntro = el('scene-intro');
  const sceneBook = el('scene-book');
  const sceneOutro = el('scene-outro');
  const webTransition = el('webTransition');
  const thwipText = el('thwipText');
  const enterWebBtn = el('enterWebBtn');
  const soundToggle = el('soundToggle');
  const book = el('book');
  const bookCover = el('bookCover');
  const bookPagesWrap = el('bookPages');
  const openBookBtn = el('openBookBtn');
  const prevPageBtn = el('prevPageBtn');
  const nextPageBtn = el('nextPageBtn');
  const coverName = el('coverName');
  const bookClosingMsg = el('bookClosingMsg');
  const cat = el('cat');
  const flowerGift = el('flowerGift');
  const chocGift = el('chocGift');
  const outroMessage = el('outroMessage');
  const outroPersonalMsg = el('outroPersonalMsg');
  const heartWeb = el('heartWeb');
  const finaleButtons = el('finaleButtons');
  const readAgainBtn = el('readAgainBtn');
  const oneMoreTimeBtn = el('oneMoreTimeBtn');
  const confettiCanvas = el('confettiCanvas');
  const bookStage = document.querySelector('.book-stage');

  const scenes = [sceneIntro, sceneBook, sceneOutro];
  function showScene(scene){
    scenes.forEach(s=>s.classList.toggle('active', s===scene));
  }

  function fill(str){
    return String(str||'')
      .replace(/{{\s*recipient\s*}}/gi, birthdayConfig.recipientName)
      .replace(/{{\s*sender\s*}}/gi, birthdayConfig.senderName);
  }
  let audioCtx = null;
  let soundEnabled = birthdayConfig.soundEffectsEnabled !== false;
  function ctx(){
    if(!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AC();
    }
    if(audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  function tone(freqStart, freqEnd, duration, type, gainPeak, delay){
    if(!soundEnabled) return;
    try{
      const c = ctx();
      const t0 = c.currentTime + (delay||0);
      const osc = c.createOscillator();
      const gain = c.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freqStart, t0);
      osc.frequency.exponentialRampToValueAtTime(Math.max(freqEnd,1), t0+duration);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(gainPeak||0.2, t0+duration*0.15);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0+duration);
      osc.connect(gain).connect(c.destination);
      osc.start(t0);
      osc.stop(t0+duration+0.02);
    }catch(e){/* audio not available; fail silently */}
  }
  function noiseBurst(duration, gainPeak, delay){
    if(!soundEnabled) return;
    try{
      const c = ctx();
      const t0 = c.currentTime + (delay||0);
      const bufferSize = c.sampleRate * duration;
      const buffer = c.createBuffer(1, bufferSize, c.sampleRate);
      const data = buffer.getChannelData(0);
      for(let i=0;i<bufferSize;i++){ data[i] = (Math.random()*2-1) * (1 - i/bufferSize); }
      const src = c.createBufferSource();
      src.buffer = buffer;
      const gain = c.createGain();
      gain.gain.setValueAtTime(gainPeak||0.15, t0);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0+duration);
      const filter = c.createBiquadFilter();
      filter.type='highpass'; filter.frequency.value=800;
      src.connect(filter).connect(gain).connect(c.destination);
      src.start(t0);
    }catch(e){}
  }
  const sfx = {
    thwip: ()=>{ tone(900,140,.18,'sawtooth',.22); noiseBurst(.12,.1); },
    whoosh: ()=>{ noiseBurst(.4,.18); },
    pop: ()=>{ tone(500,900,.12,'square',.15); },
    sparkle: ()=>{ tone(1200,2000,.25,'sine',.12); tone(1600,2400,.3,'sine',.08,.05); },
    meow: ()=>{ tone(600,900,.18,'sine',.15); tone(900,500,.22,'sine',.15,.16); },
    confetti: ()=>{ [0,0.06,0.12].forEach((d,i)=>tone(700+i*220,1100+i*220,.2,'triangle',.1,d)); }
  };
  const musicTracks = {};
  ['intro','book','outro'].forEach(key=>{
    const src = birthdayConfig.music && birthdayConfig.music[key];
    if(src){
      const audio = new Audio(src);
      audio.loop = true;
      audio.volume = 0.4;
      musicTracks[key] = audio;
    }
  });
  let currentMusicKey = null;
  function playMusic(key){
    if(currentMusicKey && musicTracks[currentMusicKey]) musicTracks[currentMusicKey].pause();
    currentMusicKey = key;
    if(soundEnabled && musicTracks[key]){
      musicTracks[key].currentTime = 0;
      musicTracks[key].play().catch(()=>{});
    }
  }
  function updateSoundToggleUI(){
    soundToggle.textContent = soundEnabled ? '\u{1F50A}' : '\u{1F507}';
    soundToggle.setAttribute('aria-pressed', String(soundEnabled));
  }
  soundToggle.addEventListener('click', ()=>{
    soundEnabled = !soundEnabled;
    updateSoundToggleUI();
    if(!soundEnabled){
      Object.values(musicTracks).forEach(a=>a.pause());
    } else if(currentMusicKey){
      playMusic(currentMusicKey);
    }
  });
  updateSoundToggleUI();
  function shakeScreen(){
    const app = el('app');
    app.classList.remove('shake');
    void app.offsetWidth;
    app.classList.add('shake');
  }
  function sparkleBurst(x, y, count){
    const app = el('app');
    for(let i=0;i<(count||8);i++){
      const s = document.createElement('div');
      s.className = 'sparkle';
      const angle = (Math.PI*2*i)/(count||8);
      const dist = 40 + Math.random()*30;
      s.style.left = x + 'px';
      s.style.top = y + 'px';
      s.style.setProperty('--dx', Math.cos(angle)*dist+'px');
      app.appendChild(s);
      requestAnimationFrame(()=>{
        s.style.transform = `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px)`;
        s.classList.add('go');
      });
      setTimeout(()=>s.remove(), 950);
    }
  }

  function runIntroSequence(){
    const line1 = document.querySelector('.intro-line[data-line="1"]');
    const line2 = document.querySelector('.intro-line[data-line="2"]');
    const ready = el('readyText');
    line1.textContent = fill(birthdayConfig.intro.line1);
    line2.textContent = fill(birthdayConfig.intro.line2);
    setTimeout(()=>line1.classList.add('show'), 500);
    setTimeout(()=>line2.classList.add('show'), 1700);
    setTimeout(()=>ready.classList.add('show'), 3000);
    setTimeout(()=>enterWebBtn.classList.add('show'), 3500);
  }
  runIntroSequence();
  playMusic('intro');

  function webTransitionTo(nextFn, opts){
    opts = opts || {};
    webTransition.classList.remove('retreating');
    webTransition.classList.add('firing');
    sfx.thwip();
    shakeScreen();
    thwipText.style.left = '50%';
    thwipText.style.top = '50%';
    thwipText.style.transform = 'translate(-50%,-50%) scale(.4) rotate(-8deg)';
    thwipText.classList.remove('pop'); void thwipText.offsetWidth; thwipText.classList.add('pop');

    setTimeout(()=>{
      sfx.whoosh();
      if(typeof nextFn === 'function') nextFn();
    }, 480);

    setTimeout(()=>{
      webTransition.classList.remove('firing');
      webTransition.classList.add('retreating');
    }, 620);

    setTimeout(()=>{
      webTransition.classList.remove('retreating');
    }, 1150);
  }

  enterWebBtn.addEventListener('click', ()=>{
    ctx(); 
    webTransitionTo(()=>{
      showScene(sceneBook);
      playMusic('book');
    });
  });

  coverName.textContent = birthdayConfig.recipientName;

  const pages = birthdayConfig.pages || [];
  let currentPage = -1;

  function buildPageEl(page, index){
    const p = document.createElement('div');
    p.className = 'page' + (page.type==='final' ? ' final-page' : '');
    p.dataset.index = index;

    const eyebrow = document.createElement('div');
    eyebrow.className = 'page-eyebrow';
    eyebrow.textContent = page.title || '';
    p.appendChild(eyebrow);

    if(page.type === 'photo'){
      const msg = document.createElement('div');
      msg.className = 'page-message';
      msg.textContent = fill(page.message);
      p.appendChild(msg);

      const slot = document.createElement('div');
      slot.className = 'photo-slot';
      if(page.photo && page.photo.src){
        const img = document.createElement('img');
        img.alt = page.photo.caption || 'Memory photo';
        img.loading = 'eager';
        img.referrerPolicy = 'no-referrer';
        img.onerror = function(){
          slot.classList.add('error');
          slot.innerHTML = '<span>\u26A0\uFE0F Foto gagal dimuat</span>' +
            '<span style="font-size:11px;opacity:.75;">Link gambar diblokir/rusak. Coba upload ulang ke host lain (mis. imgur/ibb) atau ganti photo.src.</span>';
        };
        img.src = page.photo.src;
        slot.appendChild(img);
      } else {
        slot.innerHTML = '<span>\u{1F4F7} Add a photo here</span><span style="font-size:11px;opacity:.7;">(set photo.src in birthdayConfig)</span>';
      }
      p.appendChild(slot);

      if(page.photo && (page.photo.caption || page.photo.date)){
        const cap = document.createElement('div');
        cap.className = 'photo-caption';
        cap.textContent = [page.photo.caption, page.photo.date].filter(Boolean).join(' \u2022 ');
        p.appendChild(cap);
      }
    } else if(page.type === 'wishes'){
      const list = document.createElement('div');
      list.className = 'wishes-list';
      (page.wishes||[]).forEach(w=>{
        const b = document.createElement('div');
        b.className = 'speech-bubble';
        b.textContent = fill(w);
        list.appendChild(b);
      });
      p.appendChild(list);
    } else if(page.type === 'final'){
      const msg = document.createElement('div');
      msg.className = 'page-message';
      msg.textContent = fill(page.message);
      p.appendChild(msg);

      if(page.signature){
        const sig = document.createElement('div');
        sig.className = 'page-message';
        sig.style.marginTop = '14px';
        sig.style.fontStyle = 'italic';
        sig.textContent = fill(page.signature);
        p.appendChild(sig);
      }

      const happy = document.createElement('div');
      happy.className = 'final-happy';
      happy.textContent = 'HAPPY BIRTHDAY!';
      p.appendChild(happy);
    } else {
      const msg = document.createElement('div');
      msg.className = 'page-message';
      msg.textContent = fill(page.message);
      p.appendChild(msg);
    }

    const num = document.createElement('div');
    num.className = 'page-num';
    num.textContent = (index+1) + ' / ' + pages.length;
    p.appendChild(num);

    return p;
  }

  pages.forEach((page,i)=>{
    const p = buildPageEl(page,i);
    p.style.zIndex = String(pages.length - i);
    bookPagesWrap.appendChild(p);
  });
  const pageEls = Array.from(bookPagesWrap.children);

  function fireWebAtNav(navBtn, direction){
    const stageRect = bookStage.getBoundingClientRect();
    const navRect = navBtn.getBoundingClientRect();
    const shot = document.createElement('div');
    shot.className = 'page-web-shot';
    const startX = navRect.left + navRect.width/2 - stageRect.left;
    const startY = navRect.top + navRect.height/2 - stageRect.top;
    const len = Math.min(stageRect.width, stageRect.height) * 0.4;
    shot.style.left = startX + 'px';
    shot.style.top = startY + 'px';
    shot.style.setProperty('--shot-len', len+'px');
    shot.style.transform = direction === 'next' ? 'rotate(-18deg)' : 'rotate(198deg)';
    bookStage.appendChild(shot);
    requestAnimationFrame(()=>shot.classList.add('fire'));
    setTimeout(()=>shot.remove(), 450);
  }

  function updateNavButtons(){
    prevPageBtn.disabled = currentPage <= 0;
    prevPageBtn.style.display = currentPage < 0 ? 'none' : 'flex';
    nextPageBtn.style.display = currentPage < 0 ? 'none' : 'flex';
    nextPageBtn.disabled = currentPage >= pages.length; 
  }

  function openBook(){
    book.classList.add('open');
    sfx.whoosh();
    shakeScreen();
    setTimeout(()=>{
      currentPage = 0;
      updateNavButtons();
    }, 500);
  }
  openBookBtn.addEventListener('click', openBook);

  function closeBookAndAdvance(){
    bookClosingMsg.classList.add('show');
    sfx.pop();
    setTimeout(()=>{
      webTransitionTo(()=>{
        showScene(sceneOutro);
        playMusic('outro');
        runOutroSequence();
      });
    }, 1900);
  }

  function goToPage(nextIndex, navBtn, direction){
    if(nextIndex < 0 || nextIndex > pages.length) return;
    if(navBtn){ navBtn.classList.remove('shoot'); void navBtn.offsetWidth; navBtn.classList.add('shoot'); fireWebAtNav(navBtn, direction); }
    sfx.thwip();

    setTimeout(()=>{
      shakeScreen();
      if(direction === 'next'){
        if(currentPage >=0 && currentPage < pageEls.length){
          pageEls[currentPage].classList.add('flipped');
        }
      } else {
        if(nextIndex >=0 && nextIndex < pageEls.length){
          pageEls[nextIndex].classList.remove('flipped');
        }
      }
      currentPage = nextIndex;
      updateNavButtons();
      if(direction === 'next' && currentPage >= pages.length){
        closeBookAndAdvance();
      }
    }, 260);
  }

  nextPageBtn.addEventListener('click', ()=>{
    if(nextPageBtn.disabled) return;
    goToPage(currentPage+1, nextPageBtn, 'next');
  });
  prevPageBtn.addEventListener('click', ()=>{
    if(prevPageBtn.disabled) return;
    goToPage(currentPage-1, prevPageBtn, 'prev');
  });

  let touchStartX = null;
  bookPagesWrap.addEventListener('touchstart', (e)=>{ touchStartX = e.changedTouches[0].clientX; }, {passive:true});
  bookPagesWrap.addEventListener('touchend', (e)=>{
    if(touchStartX === null || currentPage < 0) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    if(Math.abs(dx) > 40){
      if(dx < 0 && !nextPageBtn.disabled) goToPage(currentPage+1, nextPageBtn, 'next');
      else if(dx > 0 && !prevPageBtn.disabled) goToPage(currentPage-1, prevPageBtn, 'prev');
    }
    touchStartX = null;
  }, {passive:true});
  bookStage.addEventListener('click', (e)=>{
    if(e.target.closest('.page-nav') || e.target.closest('.btn')) return;
    const rect = bookStage.getBoundingClientRect();
    sparkleBurst(e.clientX-rect.left, e.clientY-rect.top, 5);
  });
  let outroHasPlayed = false;
  function runOutroSequence(){
    outroHasPlayed = true;
    cat.classList.remove('arrived','bob','blink','wave','pose');
    flowerGift.classList.remove('show');
    chocGift.classList.remove('show');
    outroMessage.classList.remove('show');
    heartWeb.classList.remove('show');
    finaleButtons.classList.remove('show');
    outroPersonalMsg.textContent = fill(birthdayConfig.outro.message);

    setTimeout(()=>{ cat.classList.add('arrived','bob'); sfx.pop(); }, 1700);
    setTimeout(()=>{ cat.classList.add('blink'); sfx.meow(); }, 2000);
    setTimeout(()=>{ cat.classList.remove('blink'); }, 2350);
    setTimeout(()=>{ cat.classList.add('wave'); }, 2500);
    setTimeout(()=>{
      flowerGift.classList.add('show');
      sfx.sparkle();
      const r = flowerGift.getBoundingClientRect();
      sparkleBurst(r.left+r.width/2, r.top+r.height/2, 10);
    }, 3600);
    setTimeout(()=>{
      chocGift.classList.add('show');
      sfx.sparkle();
      const r = chocGift.getBoundingClientRect();
      sparkleBurst(r.left+r.width/2, r.top+r.height/2, 10);
    }, 4700);
    setTimeout(()=>{
      outroMessage.classList.add('show');
      cat.classList.remove('bob');
      cat.classList.add('pose');
      sfx.pop();
    }, 5700);
    setTimeout(()=>{
      heartWeb.classList.add('show');
      sfx.thwip();
      launchConfetti();
      launchFloatingHearts();
      sfx.confetti();
    }, 6500);
    setTimeout(()=>{ finaleButtons.classList.add('show'); }, 7400);
  }

  function launchFloatingHearts(){
    const app = el('app');
    for(let i=0;i<14;i++){
      setTimeout(()=>{
        const h = document.createElement('div');
        h.className = 'floating-heart go';
        h.textContent = '\u2764\ufe0f';
        h.style.left = (10+Math.random()*80) + 'vw';
        h.style.color = Math.random()>0.5 ? '#E31B23' : '#FFD23F';
        app.appendChild(h);
        setTimeout(()=>h.remove(), 3300);
      }, i*140);
    }
  }

  const confettiColors = ['#E31B23','#0B3D91','#FFD23F','#FFFFFF'];
  let confettiParticles = [];
  let confettiRAF = null;
  const cctx = confettiCanvas.getContext('2d');
  function sizeCanvas(){
    confettiCanvas.width = confettiCanvas.clientWidth * devicePixelRatio;
    confettiCanvas.height = confettiCanvas.clientHeight * devicePixelRatio;
  }
  window.addEventListener('resize', sizeCanvas);

  function launchConfetti(){
    sizeCanvas();
    const w = confettiCanvas.clientWidth;
    confettiParticles = [];
    const count = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 90;
    for(let i=0;i<count;i++){
      confettiParticles.push({
        x: Math.random()*w,
        y: -20 - Math.random()*200,
        vy: 2+Math.random()*3,
        vx: (Math.random()-0.5)*2,
        size: 5+Math.random()*6,
        rot: Math.random()*360,
        vr: (Math.random()-0.5)*10,
        color: confettiColors[i%confettiColors.length]
      });
    }
    if(confettiRAF) cancelAnimationFrame(confettiRAF);
    let ticks = 0;
    function frame(){
      ticks++;
      cctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
      cctx.clearRect(0,0,confettiCanvas.clientWidth, confettiCanvas.clientHeight);
      confettiParticles.forEach(p=>{
        p.y += p.vy; p.x += p.vx; p.rot += p.vr;
        cctx.save();
        cctx.translate(p.x,p.y);
        cctx.rotate(p.rot*Math.PI/180);
        cctx.fillStyle = p.color;
        cctx.fillRect(-p.size/2,-p.size/4,p.size,p.size/2);
        cctx.restore();
      });
      if(ticks < 340 && confettiParticles.length){
        confettiRAF = requestAnimationFrame(frame);
      } else {
        cctx.clearRect(0,0,confettiCanvas.clientWidth, confettiCanvas.clientHeight);
      }
    }
    frame();
  }

  function resetBookToPage(index){
    pageEls.forEach((p,i)=>p.classList.toggle('flipped', i < index));
    currentPage = index;
    updateNavButtons();
  }

  readAgainBtn.addEventListener('click', ()=>{
    webTransitionTo(()=>{
      showScene(sceneBook);
      playMusic('book');
      book.classList.remove('open');
      bookClosingMsg.classList.remove('show');
      setTimeout(()=>{
        book.classList.add('open');
        resetBookToPage(0);
      }, 550);
    });
  });

  oneMoreTimeBtn.addEventListener('click', ()=>{
    webTransitionTo(()=>{
      showScene(sceneIntro);
      playMusic('intro');
      book.classList.remove('open');
      bookClosingMsg.classList.remove('show');
      resetBookToPage(-1);
      document.querySelectorAll('.intro-line, .intro-ready, #enterWebBtn').forEach(n=>n.classList.remove('show'));
      runIntroSequence();
    });
  });

})();
</script>
